      steps:
        identification:
          title: "1. Identification"
          description: "Identify yourself with your SIRET number"
        documents:
          title: "2. Documents"
          description: "Upload your administrative documents"
        candidature:
          title: "3. Application"
          description: "Receive your application certificate"

    candidate:
      hero:
        title: "Your application, tailored to each public tender, made simple"

      value_proposition:
        title: "Applying for public tenders has never been so simple!"
        description_html: "With Passe Marché, you submit an application that <strong>automatically</strong> adjusts to the tender's requirements: not too much, not too little. You save time, limit errors, and respond in just a few clicks."
        badges:
          identity: "My company's identity"
          certificates: "Certificates"
          turnover: "Turnover"
          balance_sheets: "Financial statement excerpts"

      advantages:
        title: "What are the benefits?"
        items:
          simplified_form:
            title: "A single, simplified form"
            description: "No unnecessary legal jargon, a clear process accessible to everyone."
          automatic_recovery:
            title: "Automatic retrieval of your data"
            description: "Thanks to your SIRET and public APIs, your information is pre-filled."
          accurate_info:
            title: "Accurate, up-to-date information"
            description: "Without unnecessary manual re-entry, data is verified at the source."
          secure_transmission:
            title: "Secure transmission to the buyer"
            description: "Via an official, traceable channel, your documents are transmitted with confidence."

      how_it_works:
        title: "How does it work?"
        subtitle: "A simple 3-step process to submit your application."
        steps:
          step_1: "You provide your SIRET number"
          step_2: "Your company information is retrieved automatically, and you fill in any additional information requested by the buyer"
          step_3: "Your certificate is available, your application is complete!"

    buyer:
      hero:
        title: "Your publication and application review, made simple"

      value_proposition:
        title: "Saving time on your public tenders has never been so simple!"
        description_html: "Thanks to our service, you publish your call for tenders on your buyer profile and receive applications that are already <strong>formatted</strong> and <strong>complete</strong>, thanks to the information transmitted by our APIs."
        details: "You configure your tender for applications with guided support, and gain access to the documents and information required by regulations as well as those most commonly requested by buyers."
        legend:
          authentic: "Retrieved via API"
          declared: "Self-declared"
          missing: "Missing"

      advantages:
        title: "What are the benefits?"
        items:
          standardized:
            title: "Standardized applications"
            description: "All information is structured identically for each application, making comparison easier and speeding up the selection process."
          time_saving:
            title: "Time savings"
            description: "No more endless email exchanges for missing documents; you receive complete applications that meet the requirements you defined."
          reliability:
            title: "Increased reliability"
            description: "Candidate data is pre-filled from official sources. Information that cannot be verified is clearly identified, reducing errors and fraud."

      how_it_works:
        title: "How does it work?"
        subtitle: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
        steps:
          step_1:
            title: "Configure your tender"
            description: "Freely define the elements requested in the application, while retaining full flexibility."
          step_2:
            title: "Benefit from clear guidance"
            description: "Easily view mandatory and optional documents."
          step_3:
            title: "Receive applications ready to process"
            description: "Complete, reliable files, directly accessible from your buyer profile."

      data_examples:
        title: "Some examples of available data"
        subtitle: "All this data is retrieved directly via API from official sources: automatic, secure, always up-to-date access that guarantees reliability and simplicity for your tenders."
        legal:
          title: "Legal and tax obligations"
