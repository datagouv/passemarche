  home:
    title: "Passe Marché"
    subtitle: "The simplified platform for public procurement applications"
    description: "Facilitate your administrative procedures to respond to public calls for tenders."

    welcome:
      text: "Welcome to %{app_name}, the platform that simplifies access for small and medium enterprises to French public markets. Reduce time spent on administrative formalities and focus on your business expertise."

    features:
      title: "Main features"
      siret: "Automatic SIRET identification"
      documents: "Integrated document management"
      attestations: "Official PDF certificates"
      integration: "Procurement platform integration"

    workflow:
